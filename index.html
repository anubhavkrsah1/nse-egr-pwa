<script>// ================================================================
// NSE Good Gold EGR — Database (IndexedDB)
// All app data is stored locally — works offline, no server needed
// ================================================================

const DB_NAME = "NSE_EGR_DB";
const DB_VERSION = 1;

const STORES = {
  users:        { keyPath: "id", autoIncrement: true },
  egrRequests:  { keyPath: "id", autoIncrement: true },
  pouches:      { keyPath: "id", autoIncrement: true },
  pickupJobs:   { keyPath: "id", autoIncrement: true },
  assayRecords: { keyPath: "id", autoIncrement: true },
  vaultEntries: { keyPath: "id", autoIncrement: true },
  dpInstructions:{ keyPath: "id", autoIncrement: true },
  notifications:{ keyPath: "id", autoIncrement: true },
  charges:      { keyPath: "id", autoIncrement: true },
};

let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      Object.entries(STORES).forEach(([name, opts]) => {
        if (!db.objectStoreNames.contains(name)) {
          const store = db.createObjectStore(name, opts);
          // indexes for fast lookup
          if (name === "egrRequests") {
            store.createIndex("status", "status", { unique: false });
            store.createIndex("customerId", "customerId", { unique: false });
          }
          if (name === "pouches") {
            store.createIndex("requestId", "requestId", { unique: false });
            store.createIndex("pouchNumber", "pouchNumber", { unique: true });
          }
          if (name === "notifications") {
            store.createIndex("userId", "userId", { unique: false });
            store.createIndex("read", "read", { unique: false });
          }
          if (name === "pickupJobs") {
            store.createIndex("executiveId", "executiveId", { unique: false });
            store.createIndex("status", "status", { unique: false });
          }
        }
      });
    };
  });
}

// ---- generic CRUD ----
async function add(storeName, record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const req = tx.objectStore(storeName).add({ ...record, createdAt: Date.now() });
    req.onsuccess = () => resolve(req.result);  // returns new id
    req.onerror = () => reject(req.error);
  });
}

async function put(storeName, record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const req = tx.objectStore(storeName).put({ ...record, updatedAt: Date.now() });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function get(storeName, id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getAll(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getByIndex(storeName, indexName, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).index(indexName).getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function remove(storeName, id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const req = tx.objectStore(storeName).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function count(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

    selfiePhoto: "selfie_AK_2034.jpg",
    otpVerified: true,
  });

  // demo pickup job
  await add("pickupJobs", {
    requestId: reqId,
    requestRef: "EGR-REQ-20240318-001",
    executiveId: 2,
    executiveName: "Raju Nair",
    customerName: "Anoop Kumar",
    address: "12 Lokhandwala Complex, Andheri W",
    pin: "400053",
    status: "COMPLETED",
    otpVerified: true,
    pouchNumber: "EGR-PCH-2034",
  });

  // notifications
  const notifs = [
    { userId: 1, icon: "✨", title: "EGR credited!", body: "24g (2×GOLD10G999 + 4×GOLD1G999) credited to demat. ID EGR20240321001.", read: false },
    { userId: 1, icon: "🏦", title: "Gold in vault", body: "Sequel Logistics SEEPZ — secure custody confirmed.", read: false },
    { userId: 1, icon: "🔬", title: "Refining complete", body: "Final 24.0g at 999 purity — matches approved assay.", read: false },
  ];
  for (const n of notifs) await add("notifications", { ...n, time: ts() });

  console.log("[EGR-DB] Seed data inserted");
}

// ================================================================
// EGR Request domain functions
// ================================================================
const EGR = {
  async createRequest(data) {
    const ref = genId("EGR-REQ");
    const id = await add("egrRequests", { ...data, requestRef: ref, status: "INITIATED" });
    await EGR.addNotification(data.customerId, "📅", "Request created", `Ref ${ref} — ${data.channel}.`);
    return { id, ref };
  },

  async updateStatus(requestId, status, extra = {}) {
    const req = await get("egrRequests", requestId);
    if (!req) return;
    await put("egrRequests", { ...req, ...extra, status });
  },

  async getByCustomer(customerId) {
    return getByIndex("egrRequests", "customerId", customerId);
  },

  async getAll() { return getAll("egrRequests"); },

  async createPickupJob(requestId, executiveId, executiveName, customerData) {
    const id = await add("pickupJobs", {
      requestId, executiveId, executiveName,
      customerName: customerData.name,
      address: customerData.address,
      pin: customerData.pin,
      status: "ASSIGNED",
    });
    await EGR.updateStatus(requestId, "PICKUP_ASSIGNED", { assignedExecutive: executiveName });
    return id;
  },

  async completePickup(jobId, pouchData) {
    const job = await get("pickupJobs", jobId);
    if (!job) return;
    await put("pickupJobs", { ...job, ...pouchData, status: "COMPLETED" });
    // create pouch record
    const pouchId = await add("pouches", {
      pouchNumber: pouchData.pouchNumber,
      requestId: job.requestId,
      executiveId: job.executiveId,
      status: "AT_CC",
      ...pouchData,
    });
    await EGR.updateStatus(job.requestId, "POUCH_AT_CC", { pouchId, pouchNumber: pouchData.pouchNumber });
    return pouchId;
  },

  async submitAssay(requestId, assayData) {
    const id = await add("assayRecords", { requestId, ...assayData, status: "PENDING_APPROVAL" });
    await EGR.updateStatus(requestId, "AWAITING_CUSTOMER_APPROVAL", { assayRecordId: id });
    return id;
  },

  async customerApproveAssay(requestId, split, purity) {
    await EGR.updateStatus(requestId, "APPROVED_TO_REFINER", { split, purity });
  },

  async refinerSubmit(requestId, refinerData) {
    const id = await add("vaultEntries", { requestId, ...refinerData, status: "REFINED" });
    await EGR.updateStatus(requestId, "REFINED", { refinerRecordId: id });
    return id;
  },

  async vaultConfirm(requestId, vaultData) {
    const req = await get("egrRequests", requestId);
    await put("egrRequests", { ...req, ...vaultData, status: "IN_VAULT" });
  },

  async dpCreditEGR(requestId, dpData) {
    const id = await add("dpInstructions", { requestId, ...dpData, status: "CREDITED" });
    await EGR.updateStatus(requestId, "EGR_CREDITED", { dpInstructionId: id, egrId: dpData.egrId });
    return id;
  },

  async addNotification(userId, icon, title, body) {
    return add("notifications", { userId, icon, title, body, read: false, time: ts() });
  },

  async getNotifications(userId) {
    return getByIndex("notifications", "userId", userId);
  },

  async markNotifRead(notifId) {
    const n = await get("notifications", notifId);
    if (n) await put("notifications", { ...n, read: true });
  },

  // stats for admin/dashboard
  async getStats() {
    const reqs = await getAll("egrRequests");
    const notifs = await getAll("notifications");
    const pouches = await getAll("pouches");
    return {
      totalRequests: reqs.length,
      byStatus: reqs.reduce((a, r) => { a[r.status] = (a[r.status] || 0) + 1; return a; }, {}),
      unreadNotifs: notifs.filter(n => !n.read).length,
      totalPouches: pouches.length,
    };
  },
};

// initialise on load
openDB().then(seedIfEmpty).catch(console.error);

window.EGR_DB = { openDB, add, put, get, getAll, getByIndex, remove, count, EGR, genId, ts };
</script>

// ADMIN DENOMINATION MATRIX — SEBI 1/10 deposit→trading mapping
// Admin sets which trading denoms are allowed for each deposit unit
// e.g. 100g deposit → can be split into 10×10g OR 100×1g
// ================================================================
function AdminDenomMatrix(){
  const DEPOSIT_UNITS=[
    {label:"1 milligram",g:0.001},
    {label:"10 milligrams",g:0.01},
    {label:"100 milligrams",g:0.1},
    {label:"1 gram",g:1},
    {label:"10 grams",g:10},
    {label:"100 grams",g:100},
    {label:"1 kg",g:1000},
  ];
  const TRADING_UNITS=[
    {label:"1 milligram",g:0.001},
    {label:"10 milligrams",g:0.01},
    {label:"100 milligrams",g:0.1},
    {label:"1 gram",g:1},
    {label:"10 grams",g:10},
    {label:"100 grams",g:100},
  ];
  const defaultMatrix=()=>{
    const m={};
    DEPOSIT_UNITS.forEach(d=>{
      m[d.label]=[];
      TRADING_UNITS.forEach(t=>{
        // SEBI 1/10 rule: trading unit ≤ deposit unit / 10
        if(t.g<=d.g/10) m[d.label].push(t.label);
      });
    });
    return m;
  };
  const [matrix,setMatrix]=useState(()=>{
    const s=localStorage.getItem("DENOM_MATRIX");
    return s?JSON.parse(s):defaultMatrix();
  });
  const [selected,setSelected]=useState("10 grams");
  const toggle=(depositLabel,tradingLabel)=>{
    setMatrix(m=>{
      const cur=m[depositLabel]||[];
      const next=cur.includes(tradingLabel)?cur.filter(x=>x!==tradingLabel):[...cur,tradingLabel];
      return {...m,[depositLabel]:next};
    });
  };
  const save=()=>{localStorage.setItem("DENOM_MATRIX",JSON.stringify(matrix));alert("✅ Denomination matrix saved!");};
  const reset=()=>{const d=defaultMatrix();setMatrix(d);localStorage.setItem("DENOM_MATRIX",JSON.stringify(d));};

  const dep=DEPOSIT_UNITS.find(d=>d.label===selected);
  const allowedTrading=matrix[selected]||[];

  return React.createElement(React.Fragment,null,
    React.createElement(Sec,null,"📐 Denomination Matrix"),
    React.createElement(InfoBox,null,
      "SEBI 1/10 rule: trading unit = 1/10th of deposit unit. Admin can allow additional denominations. Depositor chooses how to split (e.g. 11g → 10g×1 + 1g×1)."
    ),

    React.createElement(Sec,{style:{marginTop:10}},"Select Deposit Unit"),
    React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}},
      DEPOSIT_UNITS.map(d=>React.createElement("button",{key:d.label,onClick:()=>setSelected(d.label),style:{padding:"6px 10px",borderRadius:8,border:`2px solid ${selected===d.label?"var(--cobalt)":"var(--border2)"}`,background:selected===d.label?"var(--cobaltL)":"#fff",color:selected===d.label?"var(--cobalt)":"var(--ink2)",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"var(--font)"}},d.label))
    ),

    React.createElement(Card,{style:{background:"var(--cobaltL)",marginBottom:8}},
      React.createElement("div",{style:{fontSize:11,fontWeight:700,color:"var(--cobalt)"}},
        `Deposit: ${selected} (${dep?.g}g)`
      ),
      React.createElement("div",{style:{fontSize:9,color:"var(--ink3)",marginTop:2}},
        `SEBI default: trading ≤ ${dep?(dep.g/10):0}g | ${allowedTrading.length} denominations enabled`
      )
    ),

    React.createElement(Sec,null,"Allowed Trading Denominations"),
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:10}},
      TRADING_UNITS.map(t=>{
        const isAllowed=allowedTrading.includes(t.label);
        const isSebiDefault=t.g<=(dep?.g||0)/10;
        const maxUnits=dep?Math.floor(dep.g/t.g):0;
        return React.createElement("div",{key:t.label,style:{padding:"8px 10px",borderRadius:8,border:`2px solid ${isAllowed?"var(--cobalt)":"var(--border2)"}`,background:isAllowed?"var(--cobaltL)":"#fff",cursor:"pointer"},onClick:()=>toggle(selected,t.label)},
          React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
            React.createElement("div",null,
              React.createElement("div",{style:{fontSize:11,fontWeight:700,color:isAllowed?"var(--cobalt)":"var(--ink2)"}},t.label),
              React.createElement("div",{style:{fontSize:9,color:"var(--ink3)",marginTop:2}},`${t.g}g · max ${maxUnits} units`)
            ),
            React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}},
              isSebiDefault&&React.createElement("span",{style:{fontSize:7,background:"#e8f5e9",color:"var(--greenD)",padding:"1px 4px",borderRadius:3,fontWeight:700}},"SEBI 1/10"),
              React.createElement("span",{style:{fontSize:16}},isAllowed?"☑":"☐")
            )
          )
        );
      })
    ),

    React.createElement(Card,{style:{background:"#fff8e1",marginBottom:10}},
      React.createElement("div",{style:{fontSize:10,fontWeight:700,marginBottom:6}},`Example: Deposit ${selected}`),
      React.createElement("div",{style:{fontSize:9,color:"var(--ink3)",lineHeight:1.6}},
        allowedTrading.length>0

              const n=dep?Math.floor(dep.g/tg):0;
              return `${n}×${t} = ${dep?.g}g`;
            }).join("\nOR\n")
          : "No trading denominations enabled"
      )
    ),

    React.createElement(Sec,null,"All Deposit Units Summary"),

      )
    )

// ── Service worker registration + auto-update banner ────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").then(reg => {
      console.log("[SW] registered:", reg.scope);

      // Helper: show banner when new SW is waiting
      function checkForWaiting(r) {
        if (r.waiting) { showUpdateBanner(); return; }
        if (r.installing) {
          r.installing.addEventListener("statechange", function() {
            if (this.state === "installed" && navigator.serviceWorker.controller) {
              showUpdateBanner();
            }
            if (this.state === "activated") { showUpdateBanner(); }
          });
        }
      }

      // Check immediately (in case SW is already waiting)
      checkForWaiting(reg);

      // Check whenever update is found
      reg.addEventListener("updatefound", () => checkForWaiting(reg));

      // Periodic check: when user returns to tab, poll for update
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update();
      });

    }).catch(e => console.error("[SW] error:", e));

    // SW sends message after activating (skipWaiting path)
    navigator.serviceWorker.addEventListener("message", e => {
      if (e.data && e.data.type === "SW_UPDATED") showUpdateBanner();
    });

    // Reload when SW controller changes (new SW took over)
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!refreshing) { refreshing = true; showUpdateBanner(); }
    });
  });
}

function showUpdateBanner() {
  if (document.getElementById("egr-update-banner")) return;
  const banner = document.createElement("div");
  banner.id = "egr-update-banner";
  banner.style.cssText = [
    "position:fixed","top:0","left:0","right:0","z-index:9999",
    "background:#1B8A5A","color:#fff","padding:13px 16px",
    "display:flex","align-items:center","justify-content:space-between",
    "font-family:system-ui,sans-serif","font-size:13px","font-weight:600",
    "box-shadow:0 4px 16px rgba(0,0,0,.25)",
    "animation:slideDown .3s ease"
  ].join(";");
  banner.innerHTML = `
    <span>🚀 New version available</span>
    <button id="egr-update-btn" style="
      background:#fff;color:#1B8A5A;border:none;border-radius:8px;
      padding:7px 16px;font-weight:700;font-size:12px;cursor:pointer;
      font-family:system-ui,sans-serif;letter-spacing:.2px">
      Update now
    </button>
  `;
  // Inject the slide-down animation if not already there
  if (!document.getElementById("egr-anim-style")) {
    const style = document.createElement("style");
    style.id = "egr-anim-style";
    style.textContent = "@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}";
    document.head.appendChild(style);
  }
  document.body.appendChild(banner);
  document.getElementById("egr-update-btn").onclick = () => {
    // Tell SW to skip waiting if it's waiting, then reload
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg && reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
    });
    setTimeout(() => window.location.reload(true), 300);
  };
}
